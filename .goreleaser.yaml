# A v* tag triggers the release workflow: cross-compile every platform and
# publish a GitHub Release with checksums.
version: 2

project_name: discord-delete

builds:
  - id: linux
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.buildVersion={{ .Version }}"]
  - id: darwin
    goos: [darwin]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.buildVersion={{ .Version }}"]
  - id: windows
    goos: [windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.buildVersion={{ .Version }}"]

archives:
  - id: linux
    ids: [linux]
    formats: [tar.gz]
    wrap_in_directory: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: launchers/linux.sh
        strip_parent: true
  - id: darwin
    ids: [darwin]
    formats: [zip]
    wrap_in_directory: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: launchers/macos.command
        strip_parent: true
  - id: windows
    ids: [windows]
    formats: [zip]
    wrap_in_directory: true
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: launchers/windows.bat
        strip_parent: true

# Attached to the GitHub Release; there is no apt or dnf repo behind them.
nfpms:
  - ids: [linux]
    formats: [deb, rpm, apk]
    # Version-free so /releases/latest/download/ resolves. The README install
    # commands hardcode these names, so changing the template breaks them.
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    vendor: DatCodeMania
    homepage: "https://github.com/DatCodeMania/discord-delete"
    description: "Bulk-delete your Discord messages and reactions from your data package"
    maintainer: "DatCodeMania <aur@codemania.dev>"
    license: MIT
    section: utils
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      # Debian policy fixes this path and filename.
      - src: LICENSE
        dst: /usr/share/doc/discord-delete/copyright
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        dst: /usr/share/doc/discord-delete/README.md
        file_info:
          mode: 0644
          mtime: "{{ .CommitDate }}"
    deb:
      lintian_overrides:
        # CGO is off, so every build trips this.
        - statically-linked-binary

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  # A re-run re-uploads every asset, and GitHub 422s the ones already attached.
  replace_existing_artifacts: true

homebrew_casks:
  - repository:
      owner: DatCodeMania
      name: homebrew-tap
      token: "{{ .Env.GH_PAT }}"
    ids: [darwin]
    binaries: [discord-delete]
    directory: Casks
    homepage: "https://github.com/DatCodeMania/discord-delete"
    description: "Bulk-delete your Discord messages and reactions from your data package"
    license: MIT
    # Strip Gatekeeper quarantine
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/discord-delete"]
          end

scoops:
  - repository:
      owner: DatCodeMania
      name: scoop-bucket
      token: "{{ .Env.GH_PAT }}"
    ids: [windows]
    directory: bucket
    homepage: "https://github.com/DatCodeMania/discord-delete"
    description: "Bulk-delete your Discord messages and reactions from your data package"
    license: MIT

aurs:
  - name: discord-delete-bin
    homepage: "https://github.com/DatCodeMania/discord-delete"
    description: "Bulk-delete your Discord messages and reactions from your data package"
    maintainers:
      - "DatCodeMania <aur@codemania.dev>"
    license: MIT
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/discord-delete-bin.git"
    ids: [linux]
    provides: [discord-delete]
    conflicts: [discord-delete]
    # The archive unpacks to a folder whose name carries the arch, so a fixed
    # path only matches one arch. makepkg extracts just the current arch, so the
    # single ./*/ dir is unambiguous.
    package: |-
      install -Dm755 ./*/discord-delete "${pkgdir}/usr/bin/discord-delete"
      install -Dm644 ./*/LICENSE "${pkgdir}/usr/share/licenses/discord-delete-bin/LICENSE"
