name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # gofmt reads no build tags and has no platform behaviour, so it runs once
  # rather than once per lint target.
  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "files need gofmt:" >&2
            echo "$out" >&2
            exit 1
          fi

  # Build tags decide which files exist, so a linux-only run never sees
  # browser_windows.go. Each OS lints natively: cross-linting via GOOS can leave
  # the analyzers short of type information and report the wrong thing.
  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep LF endings on the Windows runner so source-embedded strings and
      # gofmt-formatted files survive checkout unchanged.
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  # The race detector needs cgo and a C toolchain, so it runs on ubuntu only
  # rather than in the cross-platform matrix above. The engine's concurrency is
  # not platform-specific, so one host covers it.
  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: go test -race
        run: go test -race ./...
